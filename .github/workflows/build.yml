# Builds every <folder>/PKGBUILD into a pacman repo and publishes it on
# GitHub Pages. See README.md for setup.

name: Build pacman repo

on:
  push:
    branches: [trunk]
  schedule:
    - cron: "23 5 * * *"   # daily: picks up new upstream versions via update.sh
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every package
        type: boolean
        default: false

permissions:
  contents: write   # commit pkgver bumps back
  pages: write
  id-token: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      failed: ${{ steps.build.outputs.failed }}
    env:
      # pacman repo name: the [section] in pacman.conf and the .db file name
      REPO_NAME: sochinorth
    steps:
      - name: Prepare container
        run: |
          pacman -Syu --noconfirm --needed git jq pacman-contrib
          # no separate -debug packages
          sed -i -E 's/^(OPTIONS=\(.*[ (])debug/\1!debug/' /etc/makepkg.conf
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - id: build
        name: Build packages
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ inputs.force || 'false' }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash .github/scripts/build-repo.sh
          echo "failed=$(paste -sd' ' failed.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit pkgver bumps
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/PKGBUILD'
          if git diff --cached --quiet; then
            echo "No version bumps"
            exit 0
          fi
          git commit -m "Bump $(git diff --cached --name-only | xargs -n1 dirname | paste -sd' ')"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report failed packages
        if: needs.build.outputs.failed != ''
        run: |
          echo "::error::Failed to build (previous versions kept): ${{ needs.build.outputs.failed }}"
          exit 1
